<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primitierトランジスタ回路シミュレータ</title>
  <style>
    body {
      margin: 0; font-family: sans-serif; user-select: none;
      background-color: #1e1e1e; color: #fff; overflow: hidden;
    }

    /* ツールバーの基本スタイル */
    #toolbar {
      height: 42px;
      background-color: #1e1e2e;
      border-bottom: 1px solid #2b2b3b;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 6px;
      box-sizing: border-box;
      overflow-x: auto;
      white-space: nowrap;
    }
    #toolbar::-webkit-scrollbar { height: 3px; }
    #toolbar::-webkit-scrollbar-thumb { background: #44445a; border-radius: 2px; }

    /* 共通ボタン・セレクトボックス */
    #toolbar button, #toolbar select, #file-bar button, #file-bar select {
      background-color: #2a2a3c;
      color: #e0e0e0;
      border: 1px solid #3f3f5a;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 5px;
      flex-shrink: 0;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    #toolbar button:hover, #file-bar button:hover {
      background-color: #3b3b54;
      border-color: #5a5a80;
      color: #fff;
    }
    #toolbar button:active, #file-bar button:active {
      transform: translateY(1px);
    }

    /* アクセントボタン（テキスト・言語など） */
    .btn-accent { background-color: #2b5b84 !important; border-color: #3b7baf !important; }
    .btn-accent:hover { background-color: #356c9c !important; }
    .btn-danger { background-color: #6e2a2a !important; border-color: #8f3a3a !important; }
    .btn-danger:hover { background-color: #8c3535 !important; }

    /* 縦区切り線（ディバイダー） */
    .divider {
      width: 1px;
      height: 18px;
      background-color: #3f3f5a;
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* 2段目ファイル＆速度コントロールバー */
    #file-bar {
      height: 32px;
      background-color: #181824;
      border-bottom: 1px solid #2b2b3b;
      display: flex;
      align-items: center;
      justify-content: space-between; /* 左右に綺麗に分散 */
      padding: 0 12px;
      box-sizing: border-box;
    }

    /* 2段目の左側（再生・速度エリア） */
    .file-bar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 2段目の右側（ファイル情報・保存エリア：固定位置） */
    .file-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    /* ファイル名表示エリア（固定幅＆溢れたら省略表示） */
    .file-info-container {
      display: inline-flex;
      align-items: center;
      background: #11111b;
      border: 1px solid #2b2b3b;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.4;
    }
    .file-info-label { color: #888; margin-right: 6px; }
    .file-info-name {
      color: #00ffcc;
      max-width: 340px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      vertical-align: middle;
      padding-bottom: 2px;
    }
    #canvas-container { width: 100vw; height: calc(100vh - 64px); position: relative; }
    canvas { display: block; background-color: #252526; }
    .info-text { color: #aaa; font-size: 12px; margin-left: 6px; }
    .file-info { color: #00ffcc; font-family: monospace; }

    /* テキスト入力モーダル */
    #text-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6); z-index: 1000; justify-content: center; align-items: center;
    }
    #text-modal-content {
      background: #2d2d2d; padding: 20px; border-radius: 8px;
      border: 1px solid #555; display: flex; flex-direction: column; gap: 12px; width: 340px;
    }
    #text-modal textarea {
      width: 100%; height: 90px; background: #1e1e1e; color: #fff;
      border: 1px solid #666; border-radius: 4px; padding: 8px; resize: vertical; box-sizing: border-box;
    }
    .style-setting-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .style-setting-row input[type="number"] { width: 60px; background: #1e1e1e; color: #fff; border: 1px solid #666; padding: 4px; border-radius: 4px; }
    .style-setting-row input[type="color"] { border: none; width: 32px; height: 32px; cursor: pointer; background: none; }
    #text-modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }

    /* 右クリックメニュー */
    #context-menu {
      display: none; position: fixed; background: #2d2d2d; border: 1px solid #555;
      border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 2000;
      flex-direction: column; padding: 4px 0; min-width: 140px;
    }
    #context-menu div {
      padding: 6px 14px; font-size: 12px; color: #fff; cursor: pointer;
    }
    #context-menu div:hover { background-color: #007acc; }
    #context-menu div.danger:hover { background-color: #a22; }

    /* 画面幅に応じた段階的レスポンシブ設定 */
    @media (max-width: 1500px) {
      #toolbar { gap: 5px; padding: 0 6px; }
      #toolbar button, #toolbar select { padding: 3px 6px; font-size: 11px; }
    }
    @media (max-width: 1000px) {
      #toolbar button, #toolbar select { padding: 2px 4px; font-size: 10px; }
      .info-text { font-size: 10px; margin-left: 2px; }
    }
  </style>
</head>
<body>
<div id="toolbar">
  <button onclick="addComponent('vcc')" data-i18n-title="tipVcc" data-i18n="addVcc">+ 電源(VCC)</button>
  <button onclick="addComponent('trigger_switch')" data-i18n-title="tipBtn" data-i18n="addBtn">+ トリガーSW</button>
  <button onclick="addComponent('transistor')" data-i18n-title="tipTr" data-i18n="addTr">+ トランジスタ</button>
  <button onclick="addComponent('inv_transistor')" data-i18n-title="tipInvTr" data-i18n="addInvTr">+ 反転トランジスタ</button>
  <button onclick="addComponent('crystal')" data-i18n-title="tipCrystal" data-i18n="addCrystal">+ 水晶(可変)</button>
  <button onclick="addComponent('pyrite')" data-i18n-title="tipPyrite" data-i18n="addPyrite">+ 黄鉄鉱(ダイオード)</button>
  <button onclick="addComponent('led')" data-i18n-title="tipLed" data-i18n="addLed">+ LED</button>
  <button onclick="addComponent('text')" data-i18n-title="tipText" class="btn-accent" data-i18n="addText">+ テキスト</button>

  <div class="divider"></div>

  <button onclick="resetZoom()">100%</button>
  <button onclick="zoomOut()">－</button>
  <span id="zoom-text" class="info-text">100%</span>
  <button onclick="zoomIn()">＋</button>
  <button onclick="fitCircuitToScreen()" data-i18n="fitView">全体フィット</button>

  <div class="divider"></div>

  <select id="lang-select" onchange="changeLanguage(this.value)" class="btn-accent">
    <option value="ja">日本語</option>
    <option value="en">English</option>
    <option value="ru">Русский</option>
  </select>

  <span class="info-text" style="color: #666; font-weight: bold; margin-left: 4px;">v1.2.0</span>

  <button onclick="clearCircuit()" class="btn-danger" style="margin-left:auto;" data-i18n="clear">クリア</button>
</div>

<!-- 2段目：1チックボタンのクリック演出対応バー -->
<div id="file-bar">
  <div class="file-bar-left">
    <button id="play-pause-btn" onclick="togglePlayPause()" data-i18n="pause">⏸ 一時停止</button>
    <button id="step-btn" onclick="stepSim()" data-i18n-title="tipStep" data-i18n="step">⏭ 1チック</button>
    <select id="speed-select" onchange="changeSpeed(this.value)">
      <option value="1.0">1.0x</option>
      <option value="0.5">0.5x</option>
      <option value="0.2">0.2x</option>
      <option value="0.1">0.1x</option>
      <option value="2.0">2.0x</option>
    </select>
  </div>

  <div class="file-bar-right">
    <div class="file-info-container">
      <span class="file-info-label" data-i18n="editingFile">ファイル:</span>
      <span id="current-file-text" class="file-info-name">circuit.json</span>
    </div>

    <button onclick="exportCircuit()" data-i18n="save">保存 (JSON)</button>
    <button onclick="document.getElementById('file-input').click()" data-i18n="load">読み込み</button>
    <input type="file" id="file-input" style="display:none;" onchange="importCircuit(event)">
  </div>
</div>

<div id="canvas-container">
  <canvas id="simCanvas"></canvas>
</div>

<div id="text-modal">
  <div id="text-modal-content">
    <label style="font-size: 14px; font-weight: bold;" data-i18n="editText">テキスト編集 (Enterで改行):</label>
    <textarea id="text-modal-input"></textarea>
    <div class="style-setting-row">
      <label data-i18n="fontSize">文字サイズ (px):</label>
      <input type="number" id="text-modal-size" min="8" max="72" value="13">
    </div>
    <div class="style-setting-row">
      <label data-i18n="bgColor">背景色:</label>
      <input type="color" id="text-modal-color" value="#2b3a4a">
    </div>
    <div class="buttons">
      <button onclick="closeTextModal(false)" data-i18n="cancel">キャンセル</button>
      <button onclick="closeTextModal(true)" style="background-color: #007acc;" data-i18n="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 右クリックメニュー -->
<div id="context-menu">
  <div id="menu-flip" onclick="toggleSelectedFlip()" data-i18n="flip">左右反転 (R)</div>
  <div onclick="moveSelectedZOrder('front')" data-i18n="bringToFront">最前面へ移動</div>
  <div onclick="moveSelectedZOrder('back')" data-i18n="sendToBack">最背面へ移動</div>
  <div id="menu-delete-wire" onclick="deleteSelectedWire()" class="danger" style="border-top: 1px solid #444; margin-top: 2px; padding-top: 6px;" data-i18n="deleteWire">電線を削除</div>
  <div id="menu-delete" onclick="deleteSelectedTarget()" class="danger" data-i18n="delete">削除</div>
</div>

<script>
// ===================================================================
// 多言語辞書 (i18n)
// ===================================================================
const I18N = {
  ja: {

    addVcc: "+ 電源(VCC)", addBtn: "+ トリガーSW", addTr: "+ トランジスタ", addInvTr: "+ 反転トランジスタ",

  },
  en: {

    addVcc: "+ VCC Power", addBtn: "+ Trigger SW", addTr: "+ Transistor", addInvTr: "+ NOT Transistor",
    addCrystal: "+ Crystal (Var)", addPyrite: "+ Pyrite (Diode)", addLed: "+ LED", addText: "+ Text",
    save: "Save (JSON)", load: "Load", clear: "Clear", editingFile: "File:",
    fitView: "Fit View",
    editText: "Edit Text (Enter for newline):", fontSize: "Font Size (px):", bgColor: "Background Color:",
    cancel: "Cancel", saveBtn: "Save", bringToFront: "Bring to Front", sendToBack: "Send to Back",
    delete: "Delete", deleteWire: "Delete Wire",
    flip: "Flip Horizontally (R)",
    compVcc: "VCC Power", compBtn: "Trigger SW", compTr: "Transistor", compInvTr: "NOT Transistor",
    compCrystal: "Crystal", compPyrite: "Pyrite (▶)", compLed: "LED",
    promptFileName: "Enter file name to save:",
    promptCrystal: "Enter crystal thickness (cm / min 1cm):",
    alertCrystalErr: "Please enter a number >= 1cm!",
    loadErr: "Failed to load: ",
    defaultText: "Description Text\n(Drag bottom-right to resize)",

    tipText: "Add Text (Shortcut: 8)",
    tipStep: "Step 0.1s (Shortcut: N)"
  },
  ru: {
    appTitle: "Симулятор транзисторных схем Primitier",
    addVcc: "+ Питание (VCC)", addBtn: "+ Триггер(SW)", addTr: "+ Транзистор", addInvTr: "+ Инв. транзистор",
    addCrystal: "+ Кристалл", addPyrite: "+ Пирит (Диод)", addLed: "+ Светодиод", addText: "+ Текст",
    save: "Сохранить (JSON)", load: "Загрузить", clear: "Очистить", editingFile: "Файл:",
    fitView: "По размеру экрана",
    editText: "Редактировать текст (Enter для переноса):", fontSize: "Размер шрифта (px):", bgColor: "Цвет фона:",
    cancel: "Отмена", saveBtn: "Сохранить", bringToFront: "На передний план", sendToBack: "На задний план",
    delete: "Удалить", deleteWire: "Удалить провод",
    flip: "Отразить по горизонтали (R)",
    compVcc: "Питание (VCC)", compBtn: "Триггер(SW)", compTr: "Транзистор", compInvTr: "Инв. транзистор",

    promptCrystal: "Введите толщину кристалла (см / мин. 1 см):",
    alertCrystalErr: "Пожалуйста, введите число >= 1 см!",
    loadErr: "Ошибка загрузки: ",
    defaultText: "Текст описания\n(Потяните за правый нижний угол)",
    play: "▶ Пуск", pause: "⏸ Пауза", step: "⏭ 1 такт",
    tipVcc: "Добавить VCC (Ярлык: 1)",
    tipBtn: "Добавить Триггер (Ярлык: 2)",
    tipTr: "Добавить Транзистор (Ярлык: 3)",
    tipInvTr: "Добавить Инв. транзистор (Ярлык: 4)",
    tipCrystal: "Добавить Кристалл (Ярлык: 5)",
    tipPyrite: "Добавить Пирит (Ярлык: 6)",
    tipLed: "Добавить Светодиод (Ярлык: 7)",
    tipText: "Добавить Текст (Ярлык: 8)",
    tipStep: "Шаг 0.1с (Ярлык: N)"
  }
};

let currentLang = 'ja';
function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || I18N['ja'][key] || key; }

function changeLanguage(lang) {
  currentLang = lang;
  document.title = t('appTitle');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key) el.textContent = t(key);
  });

  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    if (key) el.title = t(key);
  });

  try { localStorage.setItem('primitier_simulator_lang', lang); } catch (e) {}
}

(function initLanguage() {
  let initialLang = 'ja';
  try {
    const saved = localStorage.getItem('primitier_simulator_lang');
    if (saved && ['ja', 'en', 'ru'].includes(saved)) initialLang = saved;
    else {
      const browserLang = (navigator.language || navigator.userLanguage || '').slice(0, 2);
      if (['en', 'ru'].includes(browserLang)) initialLang = browserLang;
    }
  } catch (e) {}
  const selectEl = document.getElementById('lang-select');
  if (selectEl) selectEl.value = initialLang;
  changeLanguage(initialLang);
})();

// ===================================================================
// 定数定義 ＆ 判定ヘルパー
// ===================================================================
const UI = {
  GRID_SIZE: 10,
  COMP_W: 110, COMP_H: 60,
  TRIGGER_W: 110, TRIGGER_H: 40,
  TEXT_W: 200, TEXT_H: 60,
  PIN_R: 6, WAYPOINT_R: 5,
  WIRE_W: 5, WIRE_DASH_W: 2,
  COLOR: {
    COMP_BG: '#4a4a58', PYRITE_BG: '#636300',
    BORDER_NORM: '#777788', BORDER_SEL: '#00aaff',
    PIN_ON: '#fbff87', PIN_OFF: '#888', WIRE_ON: '#fbff87', WIRE_OFF: '#888',
    LED_ON: '#ffffff', LED_OFF: '#909090', TEXT_DEF_BG: '#2b3a4a',
    WAYPOINT: '#949494',
    WAYPOINT_BORDER_SEL: '#ffffff', WAYPOINT_BORDER_NORM: '#000000'
  },
  DIODE_COMPS: ['transistor', 'inv_transistor'],
  INPUT_PINS: ['in', 'ctrl']
};

function isInputPinOfDiodeComp(comp, pinId) {
  if (!comp || !pinId) return false;

  if (UI.DIODE_COMPS.includes(comp.type)) {
    return UI.INPUT_PINS.includes(pinId);
  }

  return false;
}

function snapToGrid(val) { return Math.round(val / UI.GRID_SIZE) * UI.GRID_SIZE; }

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 64; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight - 64;

let components = [];
let wires = [];
let nextId = 1;
let currentFileName = 'circuit';

let scale = 1.0, panX = 0, panY = 0;
let isPanning = false, panStartX = 0, panStartY = 0
let draggedComponent = null, resizingComponent = null, connectingPin = null;
let draggedWaypoint = null;
let rawMousePos = { x: 0, y: 0 }, mousePos = { x: 0, y: 0 };
let isSelecting = false, selectionStart = { x:0, y:0 }, selectionEnd = { x:0, y:0 };

let dragTargetComponent = null;   // 現在掴んでいるパーツのデータ
let dragOffsetX = 0;              // カーソル先端とパーツ左上の横ズレ量
let dragOffsetY = 0;              // カーソル先端とパーツ左上の縦ズレ量
let isMouseDown = false;          // マウスボタンを押している状態の管理

let isPaused = false;            // 一時停止状態フラグ
let simSpeed = 1.0;              // 速度倍率 (1.0 = 標準)
let simAccumulator = 0;          // 時間蓄積用カウンター
const TICK_TIME = 100;           // 1チックあたりの基本時間 (100ms = 0.1秒)

let selectedComponentIds = new Set();
let selectedWaypointKeys = new Set();
let selectedWaypointOffsets = [];

let rightClickTarget = null;
let editingTextComp = null;

function screenToWorld(sx, sy) { return { x: (sx - panX) / scale, y: (sy - panY) / scale }; }
function getWaypointKey(wire, pointIndex) { return `${wires.indexOf(wire)}_${pointIndex}`; }
function clearSelections() { selectedComponentIds.clear(); selectedWaypointKeys.clear(); }
function hideContextMenu() { document.getElementById('context-menu').style.display = 'none'; rightClickTarget = null; }

function moveSelectedZOrder(direction) {
  if (selectedComponentIds.size === 0) { hideContextMenu(); return; }
  const selectedList = components.filter(c => selectedComponentIds.has(c.id));
  const unselectedList = components.filter(c => !selectedComponentIds.has(c.id));
  components = (direction === 'front') ? [...unselectedList, ...selectedList] : [...selectedList, ...unselectedList];
  hideContextMenu();
  saveState();
}

function toggleSelectedFlip() {
  if (selectedComponentIds.size === 0) { hideContextMenu(); return; }
  components.forEach(c => {
    if (selectedComponentIds.has(c.id)) {
      c.flipped = !c.flipped;
    }
  });
  hideContextMenu();
  saveState();
}

function deleteSelectedTarget() {
  if (rightClickTarget) {
    if (rightClickTarget.type === 'waypoint') {
      rightClickTarget.wire.points.splice(rightClickTarget.index, 1);
      clearSelections();
    } else if (rightClickTarget.type === 'wire') {
      wires.splice(rightClickTarget.wireIndex, 1);
      clearSelections();
    } else if (rightClickTarget.type === 'component') {
      if (selectedComponentIds.has(rightClickTarget.comp.id)) {
        components = components.filter(c => !selectedComponentIds.has(c.id));
        wires = wires.filter(w => !selectedComponentIds.has(w.fromCompId) && !selectedComponentIds.has(w.toCompId));
      } else {
        components = components.filter(c => c.id !== rightClickTarget.comp.id);
        wires = wires.filter(w => w.fromCompId !== rightClickTarget.comp.id && w.toCompId !== rightClickTarget.comp.id);
      }
      clearSelections();
    }
    saveState();
  }
  hideContextMenu();
}

function deleteSelectedWire() {
  if (rightClickTarget) {
    if (rightClickTarget.type === 'waypoint') {
      const targetWire = rightClickTarget.wire;
      wires = wires.filter(w => w !== targetWire);
      clearSelections();
      saveState();
    } else if (rightClickTarget.type === 'wire') {
      wires.splice(rightClickTarget.wireIndex, 1);
      clearSelections();
      saveState();
    }
  }
  hideContextMenu();
}

// ===================================================================
// コンポーネントクラス群 (物理ゲートモデル ＆ 多言語対応)
// ===================================================================
class Component {
  constructor(id, type, x, y) {
    this.id = id; this.type = type; this.x = x; this.y = y;
    this.width = UI.COMP_W; this.height = UI.COMP_H;
    this.pins = [];
    this.flipped = false;
  }

  addPin(id, type, relX, relY) { this.pins.push({ id, type, relX, relY, state: false }); }
  getPin(id) { return this.pins.find(p => p.id === id); }

  updatePinPositions() {
    const midY = snapToGrid(this.height / 2);
    const pIn = this.getPin('in');
    const pOut = this.getPin('out');
    const pCtrl = this.getPin('ctrl');

    if (pIn) { pIn.relY = midY; }
    if (pOut) { pOut.relX = this.width; pOut.relY = midY; }
    if (pCtrl) { pCtrl.relX = snapToGrid(this.width / 2); }
  }

   getPinPos(pin) {
    if (!pin) return { x: this.x, y: this.y };
    const rx = this.flipped ? (this.width - pin.relX) : pin.relX;
    return { x: this.x + rx, y: this.y + pin.relY };
  }

  resetPins() { this.pins.forEach(p => p.state = false); }
  updateTimer(dt) {}

  bidirectionalConduct(pA, pB) {
    let changed = false;
    if (pA && pB) {
      if (pA.state && !pB.state) { pB.state = true; changed = true; }
      if (pB.state && !pA.state) { pA.state = true; changed = true; }
    }
    return changed;
  }

  processImmediateLogic() { return false; }
  getName() { return this.type; }
  drawCustom(ctx, scale) {}

  draw(ctx, isSelected, scale) {
    ctx.fillStyle = UI.COLOR.COMP_BG;
    ctx.strokeStyle = isSelected ? UI.COLOR.BORDER_SEL : UI.COLOR.BORDER_NORM;
    ctx.lineWidth = (isSelected ? 3 : 2) / scale;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.strokeRect(this.x, this.y, this.width, this.height);

    if (this.drawCustom === Component.prototype.drawCustom) {
      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(this.getName(), this.x + this.width / 2, this.y + this.height / 2 + 4);
    }

    if (this.flipped) {
      ctx.fillStyle = '#ffaa00';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('[R]', this.x + this.width - 4, this.y + 12);
    }

    this.drawCustom(ctx, scale);

    if (isSelected && ['text', 'pyrite', 'led'].includes(this.type)) {
      ctx.fillStyle = UI.COLOR.BORDER_SEL;
      ctx.fillRect(this.x + this.width - 8, this.y + this.height - 8, 8, 8);
    }

    this.pins.forEach(p => {
      const pos = this.getPinPos(p);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, UI.PIN_R, 0, Math.PI * 2);
      ctx.fillStyle = p.state ? UI.COLOR.PIN_ON : UI.COLOR.PIN_OFF;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1 / scale;
      ctx.stroke();
      ctx.fillStyle = '#aaa';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.id, pos.x, pos.y - 8);
    });
  }

  serialize() {
    return {
      id: this.id, type: this.type, x: this.x, y: this.y,
      width: this.width, height: this.height, flipped: this.flipped
    };
  }
  deserialize(data) {
    this.width = data.width; this.height = data.height;
    this.flipped = !!data.flipped;
    this.updatePinPositions();
  }
}

class Vcc extends Component {
  constructor(id, x, y) { super(id, 'vcc', x, y); this.addPin('out', 'out', UI.COMP_W, snapToGrid(UI.COMP_H/2)); }
  resetPins() { this.getPin('out').state = true; }
  getName() { return t('compVcc'); }
}

class TriggerSwitch extends Component {
  constructor(id, x, y) {
    super(id, 'trigger_switch', x, y);
    this.width = UI.TRIGGER_W;
    this.height = UI.TRIGGER_H;
    this.addPin('a', 'in', 0, snapToGrid(this.height / 2));
    this.addPin('b', 'out', this.width, snapToGrid(this.height / 2));
    this.switchState = false;
  }

  getPin(id) {
    if (id === 'in') id = 'a';
    if (id === 'out') id = 'b';
    return this.pins.find(p => p.id === id);
  }

  updatePinPositions() {
    const midY = snapToGrid(this.height / 2);
    const pA = this.getPin('a');
    const pB = this.getPin('b');
    if (pA) { pA.relY = midY; }
    if (pB) { pB.relX = this.width; pB.relY = midY; }
  }

  processImmediateLogic() {
    if (!this.switchState) return false;
    return this.bidirectionalConduct(this.getPin('a'), this.getPin('b'));
  }

  getName() {
    return `${t('compBtn')} [${this.switchState ? 'ON' : 'OFF'}]`;
  }
}

// ===================================================================
// 黄鉄鉱クラス
// ===================================================================
class Pyrite extends Component {
  constructor(id, x, y) {
    super(id, 'pyrite', x, y);
    this.addPin('in', 'in', 0, snapToGrid(UI.COMP_H/2));
    this.addPin('out', 'out', UI.COMP_W, snapToGrid(UI.COMP_H/2));
  }

  processImmediateLogic() {
    const pIn = this.getPin('in');
    const pOut = this.getPin('out');
    let changed = false;

    if (pIn.state && !pOut.state) {
      pOut.state = true;
      changed = true;
    }

    return changed;
  }

  getName() {
    return this.flipped ? "黄鉄鉱 (◀)" : t('compPyrite');
  }

  drawCustom(ctx, scale) {
    ctx.fillStyle = UI.COLOR.PYRITE_BG;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.strokeRect(this.x, this.y, this.width, this.height);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';

    let displayText = this.getName();
    let fontSize = 12;

    if (this.width <= 50) {
      displayText = this.flipped ? "黄 (◀)" : "黄 (▶)";
      fontSize = 9;
    } else if (this.width < 80) {
      fontSize = 10;
    }

    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillText(displayText, this.x + this.width / 2, this.y + this.height / 2 + 3);

    if (this.flipped) {
      ctx.fillStyle = '#ffaa00';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('[R]', this.x + this.width - 4, this.y + 12);
    }
  }
}

// ===================================================================
// LEDクラス
// ===================================================================
class Led extends Component {
  constructor(id, x, y) {
    super(id, 'led', x, y);
    this.width = UI.COMP_H;
    this.height = UI.COMP_H;
    this.addPin('a', 'in', 0, snapToGrid(this.height / 2));
    this.addPin('b', 'out', this.width, snapToGrid(this.height / 2));
    this.state = false;
  }

  getPin(id) {
    if (id === 'in') id = 'a';
    if (id === 'out') id = 'b';
    return this.pins.find(p => p.id === id);
  }

  updatePinPositions() {
    const midY = snapToGrid(this.height / 2);
    const pA = this.getPin('a');
    const pB = this.getPin('b');
    if (pA) { pA.relY = midY; }
    if (pB) { pB.relX = this.width; pB.relY = midY; }
  }

  processImmediateLogic() {
    const pA = this.getPin('a');
    const pB = this.getPin('b');
    this.state = (pA && pA.state) || (pB && pB.state);
    return this.bidirectionalConduct(pA, pB);
  }

  getName() { return t('compLed'); }

  drawCustom(ctx, scale) {
    ctx.fillStyle = this.state ? UI.COLOR.LED_ON : UI.COLOR.LED_OFF;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.strokeRect(this.x, this.y, this.width, this.height);

    ctx.fillStyle = '#000000';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(this.getName(), this.x + this.width / 2, this.y + this.height / 2 + 4);
  }
}

// ===================================================================
// トランジスタ基底クラス
// ===================================================================
class BaseTransistor extends Component {
  constructor(id, type, x, y) {
    super(id, type, x, y);
    this.addPin('in', 'in', 0, snapToGrid(UI.COMP_H/2));
    this.addPin('ctrl', 'in', snapToGrid(UI.COMP_W/2), 0);
    this.addPin('out', 'out', UI.COMP_W, snapToGrid(UI.COMP_H/2));
    this.gateOpen = (type === 'inv_transistor');
  }
}

class Transistor extends BaseTransistor {
  constructor(id, x, y) { super(id, 'transistor', x, y); }

  updateTimer(dt) {
    const pCtrl = this.getPin('ctrl');
    this.gateOpen = pCtrl.state;
  }

  processImmediateLogic() {
    const pIn = this.getPin('in'), pOut = this.getPin('out');
    if (pIn.state && this.gateOpen && !pOut.state) {
      pOut.state = true;
      return true;
    }
    return false;
  }
  getName() { return t('compTr'); }
}

class InvTransistor extends BaseTransistor {
  constructor(id, x, y) { super(id, 'inv_transistor', x, y); }

  updateTimer(dt) {
    const pCtrl = this.getPin('ctrl');
    this.gateOpen = !pCtrl.state;
  }

  processImmediateLogic() {
    const pIn = this.getPin('in'), pOut = this.getPin('out');
    if (pIn.state && this.gateOpen && !pOut.state) {
      pOut.state = true;
      return true;
    }
    return false;
  }
  getName() { return t('compInvTr'); }
}

// ===================================================================
// 水晶クラス
// ===================================================================
class Crystal extends Component {
  constructor(id, x, y) {
    super(id, 'crystal', x, y);
    this.addPin('a', 'in', 0, snapToGrid(UI.COMP_H/2));
    this.addPin('b', 'out', UI.COMP_W, snapToGrid(UI.COMP_H/2));
    this.thickness = 1;
    this.crystalPhase = 'IDLE';
    this.crystalTimer = 0;
  }

  getPin(id) {
    if (id === 'in') id = 'a';
    if (id === 'out') id = 'b';
    return this.pins.find(p => p.id === id);
  }

  updatePinPositions() {
    const midY = snapToGrid(this.height / 2);
    const pA = this.getPin('a');
    const pB = this.getPin('b');
    if (pA) { pA.relY = midY; }
    if (pB) { pB.relX = this.width; pB.relY = midY; }
  }

  updateTimer(dt) {
    const pA = this.getPin('a');
    const pB = this.getPin('b');
    if (!pA || !pB) return;

    const hasInput = pA.state || pB.state;

    if (!hasInput) {
      this.crystalPhase = 'IDLE';
      return;
    }

    if (this.thickness === 1) {
      if (this.crystalPhase === 'IDLE') {
        this.crystalPhase = 'SUSTAIN';
      }
    } else {
      if (this.crystalPhase === 'IDLE') {
        this.crystalPhase = 'ON_PULSE';
        this.crystalTimer = 1;
      } else if (this.crystalPhase === 'ON_PULSE') {
        this.crystalPhase = 'OFF_INTERVAL';
        this.crystalTimer = this.thickness - 1;
      } else if (this.crystalPhase === 'OFF_INTERVAL') {
        this.crystalTimer--;
        if (this.crystalTimer <= 0) {
          this.crystalPhase = 'ON_PULSE';
          this.crystalTimer = 1;
        }
      }
    }
  }

  processImmediateLogic() {
    const isActive = (this.thickness === 1 && this.crystalPhase === 'SUSTAIN') ||
                     (this.thickness !== 1 && this.crystalPhase === 'ON_PULSE');

    if (!isActive) return false;
    return this.bidirectionalConduct(this.getPin('a'), this.getPin('b'));
  }

  getName() { return `${t('compCrystal')} (${this.thickness}cm)`; }
  serialize() { const data = super.serialize(); data.thickness = this.thickness; return data; }
  deserialize(data) { super.deserialize(data); this.thickness = data.thickness || 1; }
}

class TextComp extends Component {
  constructor(id, x, y) {
    super(id, 'text', x, y);
    this.width = UI.TEXT_W; this.height = UI.TEXT_H;
    this.text = t('defaultText'); this.fontSize = 13; this.bgColor = UI.COLOR.TEXT_DEF_BG;
  }
  draw(ctx, isSelected, scale) {
    ctx.fillStyle = this.bgColor;
    ctx.strokeStyle = isSelected ? UI.COLOR.BORDER_SEL : '#ffcc00';
    ctx.lineWidth = (isSelected ? 2 : 1) / scale; ctx.setLineDash([4 / scale, 2 / scale]);
    ctx.fillRect(this.x, this.y, this.width, this.height); ctx.strokeRect(this.x, this.y, this.width, this.height);
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffffff'; ctx.font = `${this.fontSize}px sans-serif`; ctx.textAlign = 'left';
    const lines = this.text.split('\n'), lh = this.fontSize * 1.3;
    lines.forEach((line, idx) => ctx.fillText(line, this.x + 8, this.y + this.fontSize + 6 + idx * lh));
    if (isSelected) { ctx.fillStyle = UI.COLOR.BORDER_SEL; ctx.fillRect(this.x + this.width - 8, this.y + this.height - 8, 8, 8); }
  }
  serialize() { const d = super.serialize(); d.text = this.text; d.fontSize = this.fontSize; d.bgColor = this.bgColor; return d; }
  deserialize(data) { super.deserialize(data); this.text = data.text || ''; this.fontSize = data.fontSize || 13; this.bgColor = data.bgColor || UI.COLOR.TEXT_DEF_BG; }
}

function createComponentObj(type, id, x, y) {
  switch (type) {
    case 'vcc': return new Vcc(id, x, y);
    case 'trigger_switch': return new TriggerSwitch(id, x, y);
    case 'transistor': return new Transistor(id, x, y);
    case 'inv_transistor': return new InvTransistor(id, x, y);
    case 'crystal': return new Crystal(id, x, y);
    case 'pyrite': return new Pyrite(id, x, y);
    case 'led': return new Led(id, x, y);
    case 'text': return new TextComp(id, x, y);
    default: return new Component(id, type, x, y);
  }
}

function addComponent(type, atCursor = false) {
  let targetX, targetY;

  const isMouseInCanvas = (rawMousePos.x >= 0 && rawMousePos.x <= canvas.width && rawMousePos.y >= 0 && rawMousePos.y <= canvas.height);

  if (atCursor && isMouseInCanvas) {
    targetX = snapToGrid(mousePos.x - UI.COMP_W / 2);
    targetY = snapToGrid(mousePos.y - UI.COMP_H / 2);
  } else {
    const center = screenToWorld(canvas.width / 2, canvas.height / 2);
    targetX = snapToGrid(center.x - UI.COMP_W / 2);
    targetY = snapToGrid(center.y - UI.COMP_H / 2);
  }

  components.push(createComponentObj(type, nextId++, targetX, targetY));
  saveState();
}

function clearCircuit() {
  components = [];
  wires = [];
  clearSelections();
  currentFileName = 'circuit';
  updateFileNameDisplay();
  hideContextMenu();

  isPaused = false;
  const playPauseBtn = document.getElementById('play-pause-btn');
  if (playPauseBtn) {
    playPauseBtn.setAttribute('data-i18n', 'pause');
    playPauseBtn.textContent = t('pause');
  }

  simSpeed = 1.0;
  const speedSelect = document.getElementById('speed-select');
  if (speedSelect) {
    speedSelect.value = "1.0";
  }

  resetZoom();

  saveState();
}

function resetZoom() {
  const screenCenterX = canvas.width / 2;
  const screenCenterY = canvas.height / 2;

  const worldCenterX = (screenCenterX - panX) / scale;
  const worldCenterY = (screenCenterY - panY) / scale;

  scale = 1.0;

  panX = screenCenterX - worldCenterX * scale;
  panY = screenCenterY - worldCenterY * scale;

  document.getElementById('zoom-text').textContent = '100%';
}

function zoomIn() {
  const center = { x: canvas.width / 2, y: canvas.height / 2 };
  let nScale = Math.min(5.0, scale * 1.2); // 最大500%まで拡大
  panX = center.x - (center.x - panX) * (nScale / scale);
  panY = center.y - (center.y - panY) * (nScale / scale);
  scale = nScale;
  document.getElementById('zoom-text').textContent = `${Math.round(scale * 100)}%`;
}

function zoomOut() {
  const center = { x: canvas.width / 2, y: canvas.height / 2 };
  let nScale = Math.max(0.2, scale / 1.2); // 最小20%まで縮小
  panX = center.x - (center.x - panX) * (nScale / scale);
  panY = center.y - (center.y - panY) * (nScale / scale);
  scale = nScale;
  document.getElementById('zoom-text').textContent = `${Math.round(scale * 100)}%`;
}

function updateFileNameDisplay() { document.getElementById('current-file-text').textContent = `[ ${currentFileName}.json ]`; }

function fitCircuitToScreen(onlyIfOversized = false) {
  if (components.length === 0) {
    resetZoom();
    return;
  }

  let minX = Infinity, minY = Infinity;
  let maxX = -Infinity, maxY = -Infinity;

  components.forEach(c => {
    if (c.x < minX) minX = c.x;
    if (c.y < minY) minY = c.y;
    if (c.x + c.width > maxX) maxX = c.x + c.width;
    if (c.y + c.height > maxY) maxY = c.y + c.height;
  });

  const margin = 40; // 画面端のマージン(px)
  const circuitW = maxX - minX;
  const circuitH = maxY - minY;

  const availW = canvas.width - margin * 2;
  const availH = canvas.height - margin * 2;

  const currentNeededW = circuitW * scale;
  const currentNeededH = circuitH * scale;
  const isOversized = (currentNeededW > availW) || (currentNeededH > availH);

  if (onlyIfOversized && !isOversized) {
    panX = margin - minX * scale;
    panY = margin - minY * scale;
    return;
  }

  let newScale = Math.min(availW / circuitW, availH / circuitH);

  const minAllowedScale = 0.2;
  const maxAllowedScale = 1.5;

  if (newScale < minAllowedScale) {
    scale = minAllowedScale;
    panX = margin - minX * scale;
    panY = margin - minY * scale;
  } else {
    scale = Math.min(newScale, maxAllowedScale);
    panX = margin - minX * scale;
    panY = margin - minY * scale;
  }

  document.getElementById('zoom-text').textContent = `${Math.round(scale * 100)}%`;
}

function openTextModal(comp) {
  editingTextComp = comp;
  document.getElementById('text-modal-input').value = comp.text;
  document.getElementById('text-modal-size').value = comp.fontSize;
  document.getElementById('text-modal-color').value = comp.bgColor;
  document.getElementById('text-modal').style.display = 'flex';
  document.getElementById('text-modal-input').focus();
}
function closeTextModal(save) {
  if (save && editingTextComp) {
    editingTextComp.text = document.getElementById('text-modal-input').value;
    editingTextComp.fontSize = parseInt(document.getElementById('text-modal-size').value, 10);
    editingTextComp.bgColor = document.getElementById('text-modal-color').value;
    saveState();
  }
  document.getElementById('text-modal').style.display = 'none'; editingTextComp = null;
}

// ===================================================================
// シミュレーション更新
// ===================================================================
function updateSimulation(dt) {

  components.forEach(c => c.resetPins());

  let changed = true, loopCount = 0;
  while (changed && loopCount < 100) {
    changed = false;
    loopCount++;

    components.forEach(c => { if (c.processImmediateLogic()) changed = true; });

    wires.forEach(w => {
      const compA = components.find(c => c.id === w.fromCompId);
      const compB = components.find(c => c.id === w.toCompId);
      if (!compA || !compB) return;

      const pA = compA.getPin(w.fromPinId);
      const pB = compB.getPin(w.toPinId);
      if (!pA || !pB) return;

      const pairs = [
        { srcComp: compA, srcPin: pA, destComp: compB, destPin: pB },
        { srcComp: compB, srcPin: pB, destComp: compA, destPin: pA }
      ];

      pairs.forEach(({ srcComp, srcPin, destComp, destPin }) => {
        if (srcPin.state && !destPin.state) {
          if (destComp.type === 'trigger_switch' && !destComp.switchState) return;

          if (isInputPinOfDiodeComp(srcComp, srcPin.id)) {
            if (!isInputPinOfDiodeComp(destComp, destPin.id)) return;
          }

          destPin.state = true;
          changed = true;
        }
      });
    });
  }
  components.forEach(c => c.updateTimer(dt));
}

// ===================================================================
// 電線のパス計算処理
// ===================================================================
function getWirePath(w) {
  const fromComp = components.find(c => c.id === w.fromCompId);
  const toComp = components.find(c => c.id === w.toCompId);
  if (!fromComp || !toComp) return [];
  const p1 = fromComp.getPinPos(fromComp.getPin(w.fromPinId));
  const p2 = toComp.getPinPos(toComp.getPin(w.toPinId));
  return [p1, ...(w.points || []), p2];
}

// ===================================================================
// 描画
// ===================================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save(); ctx.translate(panX, panY); ctx.scale(scale, scale);

  components.forEach(c => c.draw(ctx, selectedComponentIds.has(c.id), scale));

  wires.forEach(w => {
    const path = getWirePath(w);
    if (path.length < 2) return;
    const fromComp = components.find(c => c.id === w.fromCompId);
    const toComp = components.find(c => c.id === w.toCompId);

    const isWireActive = (() => {
      const p1 = fromComp ? fromComp.getPin(w.fromPinId) : null;
      const p2 = toComp ? toComp.getPin(w.toPinId) : null;
      if (!p1 || !p2) return false;

      if (p1.state && p2.state) return true;

      const checkSource = (srcComp, srcPinId, destComp, destPinId) => {
        const pin = srcComp ? srcComp.getPin(srcPinId) : null;
        if (!pin || !pin.state) return false;

        if (isInputPinOfDiodeComp(srcComp, srcPinId)) {
          return destPinId !== 'out';
        }
        return true;
      };

      return checkSource(fromComp, w.fromPinId, toComp, w.toPinId) ||
             checkSource(toComp, w.toPinId, fromComp, w.fromPinId);
    })();

    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
    ctx.strokeStyle = isWireActive ? UI.COLOR.WIRE_ON : UI.COLOR.WIRE_OFF;
    ctx.lineWidth = UI.WIRE_W / scale; ctx.stroke();
  });

  wires.forEach((w, wIdx) => {
    if (w.points) {
      w.points.forEach((pt, pIdx) => {
        const isSelected = selectedWaypointKeys.has(`${wIdx}_${pIdx}`);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isSelected ? UI.WAYPOINT_R + 2 : UI.WAYPOINT_R, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? UI.COLOR.BORDER_SEL : UI.COLOR.WAYPOINT;
        ctx.fill();
        ctx.strokeStyle = isSelected ? UI.COLOR.WAYPOINT_BORDER_SEL : UI.COLOR.WAYPOINT_BORDER_NORM;
        ctx.lineWidth = (isSelected ? 2 : 1) / scale; ctx.stroke();
      });
    }
  });

  if (connectingPin) {
    const p1 = connectingPin.comp.getPinPos(connectingPin.pin);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(mousePos.x, mousePos.y);
    ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = UI.WIRE_DASH_W / scale;
    ctx.setLineDash([4/scale, 4/scale]); ctx.stroke(); ctx.setLineDash([]);
  }

  if (isSelecting) {
    const rx = Math.min(selectionStart.x, selectionEnd.x), ry = Math.min(selectionStart.y, selectionEnd.y);
    const rw = Math.abs(selectionEnd.x - selectionStart.x), rh = Math.abs(selectionEnd.y - selectionStart.y);
    ctx.strokeStyle = UI.COLOR.BORDER_SEL; ctx.lineWidth = 1 / scale; ctx.setLineDash([6/scale, 3/scale]);
    ctx.strokeRect(rx, ry, rw, rh); ctx.fillStyle = 'rgba(0, 170, 255, 0.1)'; ctx.fillRect(rx, ry, rw, rh); ctx.setLineDash([]);
  }
  ctx.restore();
}

// ===================================================================
// 判定ヘルパー（その他）
// ===================================================================
function getPinAt(x, y) {
  for (const c of components) {
    for (const p of c.pins) {
      const pos = c.getPinPos(p);
      if (Math.hypot(pos.x - x, pos.y - y) < 10 / scale) return { comp: c, pin: p };
    }
  }
  return null;
}
function getComponentAt(x, y) { return components.slice().reverse().find(c => x >= c.x && x <= c.x + c.width && y >= c.y && y <= c.y + c.height); }

function getWaypointAt(x, y) {
  for (const w of wires) {
    if (!w.points) continue;
    for (let i = 0; i < w.points.length; i++) {
      const pt = w.points[i];
      if (Math.hypot(pt.x - x, pt.y - y) < (UI.WAYPOINT_R + 4) / scale) return { wire: w, index: i };
    }
  }
  return null;
}

function getWireSegmentAt(x, y) {
  for (let i = 0; i < wires.length; i++) {
    const w = wires[i], path = getWirePath(w);
    for (let j = 0; j < path.length - 1; j++) {
      const p1 = path[j], p2 = path[j+1];
      const l2 = Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2);
      if (l2 === 0) continue;
      let t = Math.max(0, Math.min(1, ((x - p1.x)*(p2.x - p1.x) + (y - p1.y)*(p2.y - p1.y)) / l2));
      const projX = p1.x + t * (p2.x - p1.x), projY = p1.y + t * (p2.y - p1.y);
      if (Math.hypot(x - projX, y - projY) < Math.max(8, UI.WIRE_W + 4) / scale) return { wireIndex: i, wire: w, segmentIndex: j };
    }
  }
  return null;
}

// ===================================================================
// マウス＆キー操作
// ===================================================================
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const mx = e.clientX, my = e.clientY - 64;
  let nScale = Math.max(0.2, Math.min(5.0, e.deltaY < 0 ? scale * 1.1 : scale / 1.1));
  panX = mx - (mx - panX) * (nScale / scale); panY = my - (my - panY) * (nScale / scale); scale = nScale;
  document.getElementById('zoom-text').textContent = `${Math.round(scale * 100)}%`;
}, { passive: false });

// ===================================================================
// ピンの当たり判定関数
// ===================================================================
function findPinAt(x, y) {
  const hitRadius = 10;
  for (let i = components.length - 1; i >= 0; i--) {
    const comp = components[i];
    for (const pin of comp.pins) {
      const pos = comp.getPinPos(pin);
      const dx = x - pos.x;
      const dy = y - pos.y;
      if (dx * dx + dy * dy <= hitRadius * hitRadius) {
        return { comp: comp, pin: pin };
      }
    }
  }
  return null;
}

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const rx = e.clientX - rect.left;
  const ry = e.clientY - rect.top;
  const worldPos = screenToWorld(rx, ry);

  let target = null;

  const hitWaypoint = getWaypointAt(worldPos.x, worldPos.y);
  if (hitWaypoint) {
    target = { type: 'waypoint', wire: hitWaypoint.wire, index: hitWaypoint.index };
  } else {
    const hitComp = getComponentAt(worldPos.x, worldPos.y);
    if (hitComp) {
      target = { type: 'component', comp: hitComp };

      if (!selectedComponentIds.has(hitComp.id)) {
        clearSelections();
        selectedComponentIds.add(hitComp.id);
      }
    } else {
      const hitWireSeg = getWireSegmentAt(worldPos.x, worldPos.y);
      if (hitWireSeg) {
        target = { type: 'wire', wireIndex: hitWireSeg.wireIndex };
      }
    }
  }

  rightClickTarget = target;

  if (rightClickTarget) {
    const menuDeleteWire = document.getElementById('menu-delete-wire');
    const menuDelete = document.getElementById('menu-delete');
    const menuFlip = document.getElementById('menu-flip');

    if (menuDeleteWire) {
      if (rightClickTarget.type === 'wire' || rightClickTarget.type === 'waypoint') {
        menuDeleteWire.style.display = 'block';
      } else {
        menuDeleteWire.style.display = 'none';
      }
    }

    if (menuDelete) {
      if (rightClickTarget.type === 'component' || rightClickTarget.type === 'waypoint') {
        menuDelete.style.display = 'block';
      } else {
        menuDelete.style.display = 'none';
      }
    }

    if (menuFlip) {
      if (rightClickTarget.type === 'component' && rightClickTarget.comp) {
        const noFlipTypes = ['trigger_switch', 'crystal', 'led', 'text'];
        if (noFlipTypes.includes(rightClickTarget.comp.type)) {
          menuFlip.style.display = 'none';
        } else {
          menuFlip.style.display = 'block';
        }
      } else {
        menuFlip.style.display = 'none';
      }
    }

    const menu = document.getElementById('context-menu');
    menu.style.left = `${e.clientX}px`;
    menu.style.top = `${e.clientY}px`;
    menu.style.display = 'flex';
  } else {
    hideContextMenu();
  }
});

// ===================================================================
// マウス処理

canvas.addEventListener('mousedown', e => {
  hideContextMenu();

  const rect = canvas.getBoundingClientRect();
  rawMousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  mousePos = screenToWorld(rawMousePos.x, rawMousePos.y);
  isMouseDown = true;

  if (e.button === 0) {
    if (selectedComponentIds.size === 1) {
      const selectedId = Array.from(selectedComponentIds)[0];
      const comp = components.find(c => c.id === selectedId);
      if (comp && ['text', 'pyrite', 'led'].includes(comp.type)) {
        const handleX = comp.x + comp.width - 8;
        const handleY = comp.y + comp.height - 8;
        if (mousePos.x >= handleX && mousePos.x <= handleX + 8 &&
            mousePos.y >= handleY && mousePos.y <= handleY + 8) {
          resizingComponent = comp;
          draw();
          return;
        }
      }
    }

    const hitWaypoint = getWaypointAt(mousePos.x, mousePos.y);
    if (hitWaypoint) {
      draggedWaypoint = hitWaypoint;
      const wpKey = `${wires.indexOf(hitWaypoint.wire)}_${hitWaypoint.index}`;

      if (!e.shiftKey && !selectedWaypointKeys.has(wpKey)) {
        clearSelections();
      }
      selectedWaypointKeys.add(wpKey);

      const pt = hitWaypoint.wire.points[hitWaypoint.index];
      dragOffsetX = mousePos.x - pt.x;
      dragOffsetY = mousePos.y - pt.y;

      draw();
      return;
    }

    const hitPin = findPinAt(mousePos.x, mousePos.y);
    if (hitPin) {
      connectingPin = hitPin;
      draw();
      return;
    }

    const clickedComp = getComponentAt(mousePos.x, mousePos.y);
    if (clickedComp) {
      draggedComponent = clickedComp;
      dragOffsetX = mousePos.x - clickedComp.x;
      dragOffsetY = mousePos.y - clickedComp.y;

      if (clickedComp.type === 'trigger_switch') {
        clickedComp.switchState = true;
      }

      if (!selectedComponentIds.has(clickedComp.id) && !e.shiftKey) {
        clearSelections();
        selectedComponentIds.add(clickedComp.id);
      }
    } else {
      isSelecting = true;
      selectionStart = { ...mousePos };
      selectionEnd = { ...mousePos };
      if (!e.shiftKey) clearSelections();
    }
  } else if (e.button === 1 || e.button === 2) {
    isPanning = true;
    startPanX = e.clientX - panX;
    startPanY = e.clientY - panY;
  }
  draw();
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  rawMousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  mousePos = screenToWorld(rawMousePos.x, rawMousePos.y);

  if (isPanning) {
    panX = e.clientX - startPanX;
    panY = e.clientY - startPanY;
    draw();
    return;
  }

  if (resizingComponent) {
    const newW = snapToGrid(Math.max(40, mousePos.x - resizingComponent.x));
    const newH = snapToGrid(Math.max(40, mousePos.y - resizingComponent.y));
    resizingComponent.width = newW;
    resizingComponent.height = newH;
    resizingComponent.updatePinPositions();
    draw();
    return;
  }

  if (draggedWaypoint) {
    const pt = draggedWaypoint.wire.points[draggedWaypoint.index];
    const newX = snapToGrid(mousePos.x - dragOffsetX);
    const newY = snapToGrid(mousePos.y - dragOffsetY);
    const deltaX = newX - pt.x;
    const deltaY = newY - pt.y;

    if (deltaX !== 0 || deltaY !== 0) {
      selectedWaypointKeys.forEach(key => {
        const [wIdx, pIdx] = key.split('_');
        if (wires[wIdx] && wires[wIdx].points[pIdx]) {
          wires[wIdx].points[pIdx].x += deltaX;
          wires[wIdx].points[pIdx].y += deltaY;
        }
      });
      components.forEach(c => {
        if (selectedComponentIds.has(c.id)) {
          c.x += deltaX;
          c.y += deltaY;
        }
      });
    }
    draw();
    return;
  }

  if (draggedComponent) {
    const newX = snapToGrid(mousePos.x - dragOffsetX);
    const newY = snapToGrid(mousePos.y - dragOffsetY);
    const deltaX = newX - draggedComponent.x;
    const deltaY = newY - draggedComponent.y;

    if (deltaX !== 0 || deltaY !== 0) {
      components.forEach(c => {
        if (selectedComponentIds.has(c.id)) {
          c.x += deltaX;
          c.y += deltaY;
        }
      });
      selectedWaypointKeys.forEach(key => {
        const [wIdx, pIdx] = key.split('_');
        if (wires[wIdx] && wires[wIdx].points[pIdx]) {
          wires[wIdx].points[pIdx].x += deltaX;
          wires[wIdx].points[pIdx].y += deltaY;
        }
      });
    }
  }

  if (isSelecting) {
    selectionEnd = { ...mousePos };
  }

  draw();
});

window.addEventListener('mouseup', e => {
  if (!isMouseDown) return;

  let needSave = false;

  if (draggedComponent) {
    needSave = true;
  }

  if (e.button === 0) {
    if (connectingPin) {
      const hitPin = findPinAt(mousePos.x, mousePos.y);
      if (hitPin && (hitPin.comp !== connectingPin.comp || hitPin.pin !== connectingPin.pin)) {
        const exists = wires.some(w =>
          (w.fromCompId === connectingPin.comp.id && w.fromPinId === connectingPin.pin.id && w.toCompId === hitPin.comp.id && w.toPinId === hitPin.pin.id) ||
          (w.fromCompId === hitPin.comp.id && w.fromPinId === hitPin.pin.id && w.toCompId === connectingPin.comp.id && w.toPinId === connectingPin.pin.id)
        );
        if (!exists) {
          wires.push({
            fromCompId: connectingPin.comp.id,
            fromPinId: connectingPin.pin.id,
            toCompId: hitPin.comp.id,
            toPinId: hitPin.pin.id,
            points: []
          });
          needSave = true;
        }
      }
    }

    if (isSelecting) {
      const rx = Math.min(selectionStart.x, selectionEnd.x), ry = Math.min(selectionStart.y, selectionEnd.y);
      const rw = Math.abs(selectionEnd.x - selectionStart.x), rh = Math.abs(selectionEnd.y - selectionStart.y);
      components.forEach(c => {
        if (c.x + c.width >= rx && c.x <= rx + rw && c.y + c.height >= ry && c.y <= ry + rh) selectedComponentIds.add(c.id);
      });
      wires.forEach((w, wIdx) => {
        if (!w.points) return;
        w.points.forEach((pt, pIdx) => {
          if (pt.x >= rx && pt.x <= rx + rw && pt.y >= ry && pt.y <= ry + rh) selectedWaypointKeys.add(`${wIdx}_${pIdx}`);
        });
      });
    }

    if (draggedComponent && draggedComponent.type === 'trigger_switch') {
      draggedComponent.switchState = false;
    }
  }

  if (needSave) {
    saveState();
  }

  isMouseDown = false;
  draggedComponent = null;
  draggedWaypoint = null;
  resizingComponent = null;
  isSelecting = false;
  connectingPin = null;
  isPanning = false;
  draw();
});

canvas.addEventListener('mouseleave', () => {
  if (isMouseDown) {
    if (draggedComponent && draggedComponent.type === 'trigger_switch') {
      draggedComponent.switchState = false;
    }
    isMouseDown = false;
    draggedComponent = null;
    draggedWaypoint = null;
    resizingComponent = null;
    isSelecting = false;
    connectingPin = null;
    isPanning = false;
    draw();
  }
});

canvas.addEventListener('dblclick', e => {
  const hitSeg = getWireSegmentAt(mousePos.x, mousePos.y);
  if (hitSeg) {
    if (!hitSeg.wire.points) hitSeg.wire.points = [];
    hitSeg.wire.points.splice(hitSeg.segmentIndex, 0, { x: snapToGrid(mousePos.x), y: snapToGrid(mousePos.y) });
    saveState();
    return;
  }
  const hitComp = getComponentAt(mousePos.x, mousePos.y); if (!hitComp) return;
  if (hitComp.type === 'crystal') {
    const val = prompt(t('promptCrystal'), hitComp.thickness);
    if (val !== null) {
      const p = parseFloat(val);
      if (!isNaN(p) && p >= 1) {
        hitComp.thickness = p;
        saveState();
      } else alert(t('alertCrystalErr'));
    }
  } else if (hitComp.type === 'text') openTextModal(hitComp);
});

// ===================================================================
// コピー＆ペースト (localStorage)
// ===================================================================
const CLIPBOARD_KEY = 'primitier_circuit_clipboard';

function copySelectedComponents() {
  if (selectedComponentIds.size === 0 && selectedWaypointKeys.size === 0) return;
  const copyComps = components.filter(c => selectedComponentIds.has(c.id));
  const copyWires = wires.filter(w => selectedComponentIds.has(w.fromCompId) && selectedComponentIds.has(w.toCompId));
  try { localStorage.setItem(CLIPBOARD_KEY, JSON.stringify({ components: copyComps.map(c => c.serialize()), wires: copyWires })); }
  catch (err) { console.warn('localStorage copy failed:', err); }
}

function pasteComponents() {
  let rawData = null;
  try { const stored = localStorage.getItem(CLIPBOARD_KEY); if (stored) rawData = JSON.parse(stored); }
  catch (err) { return; }

  if (!rawData || !rawData.components || rawData.components.length === 0) return;
  const idMap = new Map(); clearSelections();
  let minX = Infinity, minY = Infinity;
  rawData.components.forEach(c => { if (c.x < minX) minX = c.x; if (c.y < minY) minY = c.y; });

  const targetX = snapToGrid(mousePos.x || minX + 30), targetY = snapToGrid(mousePos.y || minY + 30);
  rawData.components.forEach(cData => {
    const snapX = snapToGrid(targetX + (cData.x - minX)), snapY = snapToGrid(targetY + (cData.y - minY));
    const newComp = createComponentObj(cData.type, nextId++, snapX, snapY);
    newComp.deserialize(cData); components.push(newComp); idMap.set(cData.id, newComp.id); selectedComponentIds.add(newComp.id);
  });

  if (rawData.wires) {
    rawData.wires.forEach(wData => {
      const newFromId = idMap.get(wData.fromCompId), newToId = idMap.get(wData.toCompId);
      if (newFromId && newToId) {
        const copiedPoints = wData.points ? wData.points.map(pt => ({ x: snapToGrid(targetX + (pt.x - minX)), y: snapToGrid(targetY + (pt.y - minY)) })) : [];
        wires.push({ fromCompId: newFromId, fromPinId: wData.fromPinId, toCompId: newToId, toPinId: wData.toPinId, points: copiedPoints });
        const newWIdx = wires.length - 1;
        copiedPoints.forEach((_, pIdx) => selectedWaypointKeys.add(`${newWIdx}_${pIdx}`));
      }
    });
  }
  saveState();
}

window.addEventListener('keydown', e => {
  if (document.getElementById('text-modal').style.display === 'flex') return;

  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

  if (e.code === 'Space') isSpacePressed = true;

  const compKeys = {
    'Digit1': 'vcc',
    'Digit2': 'trigger_switch',
    'Digit3': 'transistor',
    'Digit4': 'inv_transistor',
    'Digit5': 'crystal',
    'Digit6': 'pyrite',
    'Digit7': 'led',
    'Digit8': 'text'
  };
  if (compKeys[e.code]) {
    e.preventDefault();
    addComponent(compKeys[e.code], true);
    return;
  }

  if (e.key === 'n' || e.key === 'N' || e.code === 'KeyN') {
    e.preventDefault();
    stepSim();

    const stepButton = document.getElementById('step-btn');
    if (stepButton) {
      stepButton.focus();

      setTimeout(() => {
        stepButton.blur();
      }, 150);
    }
    return;
  }

  if (e.key === 'r' || e.key === 'R' || e.code === 'KeyR') {
    e.preventDefault();
    toggleSelectedFlip();
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedComponentIds.size > 0 || selectedWaypointKeys.size > 0) {
      components = components.filter(c => !selectedComponentIds.has(c.id));
      wires = wires.filter(w => !selectedComponentIds.has(w.fromCompId) && !selectedComponentIds.has(w.toCompId));
      clearSelections();
      saveState();
    }
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.code === 'KeyC')) { e.preventDefault(); copySelectedComponents(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V' || e.code === 'KeyV')) { e.preventDefault(); pasteComponents(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey) {
    e.preventDefault();
    undo();
  }
  if ((e.ctrlKey || e.metaKey) && ((e.key === 'y' || e.key === 'Y') || (e.shiftKey && (e.key === 'z' || e.key === 'Z')))) {
    e.preventDefault();
    redo();
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') isSpacePressed = false; });


// ===================================================================
// 再生速度制御
// ===================================================================
function togglePlayPause() {
  isPaused = !isPaused;
  const btn = document.getElementById('play-pause-btn');
  if (btn) {
    const key = isPaused ? 'play' : 'pause';
    btn.setAttribute('data-i18n', key);
    btn.textContent = t(key);
  }
}

function changeSpeed(val) {
  simSpeed = parseFloat(val) || 1.0;
}

function stepSim() {
  if(!isPaused) togglePlayPause();
  updateSimulation(TICK_TIME);
}

// ===================================================================
// 保存 / 読み込み
// ===================================================================
function exportCircuit() {
  let name = prompt(t('promptFileName'), currentFileName); if (name === null) return;
  currentFileName = name.trim().replace(/\.json$/i, '') || 'circuit'; updateFileNameDisplay();

  const data = {
    nextId,
    components: components.map(c => c.serialize()),
    wires,
    viewState: {
      panX,
      panY,
      scale,
      canvasWidth: canvas.width,
      canvasHeight: canvas.height
    }
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = currentFileName + '.json'; a.click(); URL.revokeObjectURL(a.href);
}

// ===================================================================
// ファイル読み込み処理
// ===================================================================
function importCircuit(event) {
  const file = event.target.files[0]; if (!file) return;
  currentFileName = file.name.replace(/\.json$/i, ''); updateFileNameDisplay();
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      nextId = data.nextId || 1;
      wires = (data.wires || []).map(w => ({ ...w, points: w.points || [] }));
      components = (data.components || []).map(cd => {
        const c = createComponentObj(cd.type, cd.id, cd.x, cd.y);
        c.deserialize(cd); return c;
      });
      clearSelections();
      clearHistory();

      if (data.viewState) {
        if (data.viewState.scale !== undefined) scale = data.viewState.scale;
        if (data.viewState.panX !== undefined) panX = data.viewState.panX;
        if (data.viewState.panY !== undefined) panY = data.viewState.panY;
        document.getElementById('zoom-text').textContent = `${Math.round(scale * 100)}%`;
      }

      isPaused = false;
      const playPauseBtn = document.getElementById('play-pause-btn');
      if (playPauseBtn) {
        playPauseBtn.setAttribute('data-i18n', 'pause');
        playPauseBtn.textContent = t('pause');
      }

      simSpeed = 1.0;
      const speedSelect = document.getElementById('speed-select');
      if (speedSelect) {
        speedSelect.value = "1.0";
      }

      saveState();
    } catch (err) { alert(t('loadErr') + err.message); }
  };
  reader.readAsText(file);
}

// ===================================================================
// Undo / Redo 履歴管理
// ===================================================================
const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 50;

function clearHistory() {
  undoStack.length = 0;
  redoStack.length = 0;
}

function saveState() {
  const state = JSON.stringify({
    nextId,
    components: components.map(c => c.serialize()),
    wires
  });

  if (undoStack.length > 0 && undoStack[undoStack.length - 1] === state) return;

  undoStack.push(state);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
}

function loadState(stateJson) {
  const data = JSON.parse(stateJson);
  nextId = data.nextId || 1;
  wires = (data.wires || []).map(w => ({ ...w, points: w.points || [] }));
  components = (data.components || []).map(cd => {
    const c = createComponentObj(cd.type, cd.id, cd.x, cd.y);
    c.deserialize(cd);
    return c;
  });
  clearSelections();
}

function undo() {
  if (undoStack.length <= 1) return;
  const currentState = undoStack.pop();
  redoStack.push(currentState);
  const prevState = undoStack[undoStack.length - 1];
  loadState(prevState);
}

function redo() {
  if (redoStack.length === 0) return;
  const nextState = redoStack.pop();
  undoStack.push(nextState);
  loadState(nextState);
}

saveState();

let lastTime = performance.now();
function loop(currentTime) {
  const realDt = currentTime - lastTime;
  lastTime = currentTime;

  if (!isPaused) {
    simAccumulator += realDt * simSpeed;

    while (simAccumulator >= TICK_TIME) {
      updateSimulation(TICK_TIME);
      simAccumulator -= TICK_TIME;
    }
  }

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const contextMenuEl = document.getElementById('context-menu');
contextMenuEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  e.stopPropagation();
});
</script>
